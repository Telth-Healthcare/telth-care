<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telth.Care - Become a Care Manager | Earn ₹30K–80K Monthly</title>

    <!-- SEO -->
    <meta name="description" content="Join Telth.Care as a Care Manager. Convert your nursing, palliative care, or home visit experience into an independent practice. Flexible work. Earn ₹30,000–80,000/month." />
    <link rel="canonical" href="https://telth.care/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Telth.Care - Become a Care Manager" />
    <meta property="og:description" content="Start your independent care practice. Flexible work. Earn ₹30K–80K/month." />
    <meta property="og:image" content="https://yourdomain.com/social-image.jpg" />
    <meta property="og:url" content="https://telth.care/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme -->
    <meta name="theme-color" content="#0f172a" />

    <!-- ================= JSON-LD START ================= -->

    <!-- 1. Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Telth.Care",
      "url": "https://telth.care/",
      "logo": "https://yourdomain.com/logo.png",
      "sameAs": [
        "https://www.linkedin.com/company/telthcare",
        "https://twitter.com/telthcare"
      ]
    }
    </script>

    <!-- 2. Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Telth.Care",
      "url": "https://telth.care/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://telth.care/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- 3. Job Posting (🔥 Most Important) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "JobPosting",
      "title": "Care Manager",
      "description": "Join Telth.Care as a Care Manager. Use your nursing, palliative care, or home healthcare experience to build an independent practice with flexible working hours.",
      "identifier": {
        "@type": "PropertyValue",
        "name": "Telth.Care",
        "value": "CARE-MANAGER-001"
      },
      "datePosted": "2026-04-01",
      "validThrough": "2026-12-31",
      "employmentType": "FULL_TIME",
      "hiringOrganization": {
        "@type": "Organization",
        "name": "Telth.Care",
        "sameAs": "https://telth.care/",
        "logo": "https://yourdomain.com/logo.png"
      },
      "jobLocation": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        }
      },
      "applicantLocationRequirements": {
        "@type": "Country",
        "name": "India"
      },
      "baseSalary": {
        "@type": "MonetaryAmount",
        "currency": "INR",
        "value": {
          "@type": "QuantitativeValue",
          "minValue": 30000,
          "maxValue": 80000,
          "unitText": "MONTH"
        }
      }
    }
    </script>

    <!-- ================= JSON-LD END ================= -->

  </head>

  <body>
    <noscript>This app requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src='https://cdn.jotfor.ms/agent/embedjs/019d75c28841754bbaaa80d21ba63082aca8/embed.js'></script>
  </body>
</html>
